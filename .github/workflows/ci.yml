name: ci
on:
  # Branches are covered by their PR's run; a bare push trigger ran CI twice
  # for every push to a PR branch.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nix-build:
    runs-on: ubuntu-latest
    # A clean run takes ~4 minutes; a hung test otherwise spins for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: ./scripts/ci.sh
  check-generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop -c ./scripts/check-hat-nix.sh
